[package]
name = "trinium_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["pierrecreeper"]
license = "LicenseRef-Trinium-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
