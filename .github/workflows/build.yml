name: Review release
'on':
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: rust@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare Python
        run: apt-get update && apt-get install --yes --no-install-recommends python3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '25.0.1'
          architecture: x64
      - name: Install pinned Maven from Apache
        run: java build-tools/PrepareMaven.java
      - name: Verify official compile-time client
        run: python3 scripts/prepare-game.py
      - name: Build and test twice from separate clean trees
        run: python3 scripts/reproduce-release.py --output review-output
      - name: Archive sources for the exact reviewed commit
        run: git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip --output=review-output/sources.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Trinium-review-${{ github.sha }}
          path: review-output/
          if-no-files-found: error
          retention-days: 30
